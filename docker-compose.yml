# Qdrant vector database for GameFin Intelligence (Phase 2, gold layer).
#
# Start it:   docker compose up -d
# Stop it:    docker compose down
# Dashboard:  http://localhost:6333/dashboard
#
# Data persists in ./qdrant_storage (gitignored). Ports:
#   6333 = REST/HTTP API (what qdrant-client uses by default)
#   6334 = gRPC API (optional, faster; not required here)
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gamefin-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
